   name: Deploy to Cafe24
   on:
     push:
       branches: [ main ]
   jobs:
     ftp-deploy:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - name: FTP 배포
           uses: SamKirkland/FTP-Deploy-Action@v4.3.5
           with:
             server: ${{ secrets.FTP_SERVER }}
             username: ${{ secrets.FTP_USERNAME }}
             password: ${{ secrets.FTP_PASSWORD }}
             local-dir: ./
             server-dir: /www/
             exclude: |
               **/.git*
               **/.git*/**
               **/.github/**
               **/README.md
